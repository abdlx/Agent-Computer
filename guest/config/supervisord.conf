[supervisord]
nodaemon=false
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:xvnc]
; SecurityTypes None + -localhost: VNC is reachable ONLY from inside the
; guest (loopback), where the sole consumer is websockify, itself reached
; solely through the authenticated control-plane proxy. A per-boot random
; password the owner can never see would add friction, not security, on
; this path. The port is never published by the platform.
command=/usr/bin/Xvnc :0 -geometry %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)s -depth %(ENV_SCREEN_DEPTH)s -rfbport 5901 -SecurityTypes None -localhost -AlwaysShared -desktop agentcomputer
user=agent
environment=HOME="/home/agent",DISPLAY=":0"
autorestart=true
priority=10
stdout_logfile=/tmp/xvnc.log
stderr_logfile=/tmp/xvnc.log

[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --nopidfile
user=agent
environment=HOME="/home/agent",DISPLAY=":0"
autorestart=true
priority=15
stdout_logfile=/tmp/dbus.log
stderr_logfile=/tmp/dbus.log

[program:openbox]
command=/usr/bin/openbox-session
user=agent
environment=HOME="/home/agent",DISPLAY=":0",HTTP_PROXY="http://acp-egress:3128",HTTPS_PROXY="http://acp-egress:3128",http_proxy="http://acp-egress:3128",https_proxy="http://acp-egress:3128",ACP_BROWSER_PROXY="http://acp-egress:3128",NO_PROXY="localhost,127.0.0.1",no_proxy="localhost,127.0.0.1"
autorestart=true
priority=20
startsecs=2
stdout_logfile=/tmp/openbox.log
stderr_logfile=/tmp/openbox.log

[program:websockify]
command=/usr/bin/websockify --web=/usr/share/novnc --heartbeat=15 127.0.0.1:6080 127.0.0.1:5901
user=agent
environment=HOME="/home/agent"
autorestart=true
priority=30
stdout_logfile=/tmp/websockify.log
stderr_logfile=/tmp/websockify.log

[program:guest-supervisor]
command=/usr/bin/python3 /opt/guest-supervisor/supervisor.py
user=agent
environment=HOME="/home/agent",DISPLAY=":0",HTTP_PROXY="http://acp-egress:3128",HTTPS_PROXY="http://acp-egress:3128",http_proxy="http://acp-egress:3128",https_proxy="http://acp-egress:3128",ACP_BROWSER_PROXY="http://acp-egress:3128",NO_PROXY="localhost,127.0.0.1",no_proxy="localhost,127.0.0.1"
autorestart=true
priority=40
stdout_logfile=/tmp/guest-supervisor.log
stderr_logfile=/tmp/guest-supervisor.log
stopwaitsecs=30
