# Agent Computer Platform — production deployment.
#
# Quick start (see DEPLOYMENT.md for the full guide):
#   cp .env.example .env        # set ACP_SUPERVISOR_SECRET
#   docker compose --profile build build guest-image
#   docker compose up -d
#   open http://127.0.0.1:8787 and create the owner account
#
# How it fits together:
# - supervisor is the ONLY service with the Docker socket. It serves a
#   narrow API on a unix socket in the shared acp-run volume.
# - control-plane serves the dashboard + API + MCP gateway, talks to the
#   supervisor over that socket, and reaches each computer's guest
#   supervisor through the socket inside its home volume — which is why
#   the host's Docker volumes directory is mounted at its IDENTICAL
#   host path in both services (socket paths come from the Docker API).
# - guest computers are plain Docker containers the supervisor creates
#   on the `guests` bridge network (outbound internet via NAT).
name: agentcomputer

services:
  supervisor:
    build: { context: ., dockerfile: deploy/Dockerfile }
    image: agentcomputer/platform:0.1.0
    command: ["node", "supervisor/src/server.ts"]
    environment:
      ACP_SUPERVISOR_SOCK: /run/acp/supervisor.sock
      ACP_SUPERVISOR_SECRET: ${ACP_SUPERVISOR_SECRET:?set ACP_SUPERVISOR_SECRET in .env}
      ACP_GUEST_IMAGE: ${ACP_GUEST_IMAGE:-agentcomputer/guest:phase0}
      ACP_GUEST_NETWORK: agentcomputer_guests
      ACP_MIN_FREE_DISK_GB: ${ACP_MIN_FREE_DISK_GB:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - acp-run:/run/acp
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    network_mode: "none"
    restart: unless-stopped

  control-plane:
    image: agentcomputer/platform:0.1.0
    command: ["node", "control-plane/src/server.ts"]
    environment:
      ACP_SUPERVISOR_SOCK: /run/acp/supervisor.sock
      ACP_SUPERVISOR_SECRET: ${ACP_SUPERVISOR_SECRET:?set ACP_SUPERVISOR_SECRET in .env}
      ACP_PORT: "8787"
      ACP_DB: /data/control-plane.db
      ACP_IDLE_TIMEOUT_S: ${ACP_IDLE_TIMEOUT_S:-300}
    volumes:
      - acp-run:/run/acp
      - acp-data:/data
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      # Localhost by default: put a TLS reverse proxy in front for
      # remote access (see DEPLOYMENT.md). Change to "8787:8787" only
      # on a trusted network.
      - "127.0.0.1:8787:8787"
    depends_on: [supervisor]
    restart: unless-stopped

  # Build-only helper: `docker compose --profile build build guest-image`
  # produces the guest image the supervisor instantiates per computer.
  guest-image:
    profiles: ["build"]
    build: { context: guest, dockerfile: Dockerfile }
    image: ${ACP_GUEST_IMAGE:-agentcomputer/guest:phase0}
    command: ["true"]

volumes:
  acp-run:
  acp-data:

networks:
  guests:
    name: agentcomputer_guests
    driver: bridge
