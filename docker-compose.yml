# Agent Computer Platform — production deployment.
#
# Quick start (see DEPLOYMENT.md for the full guide):
#   cp .env.example .env        # set ACP_SUPERVISOR_SECRET
#   docker compose --profile build build guest-image
#   docker compose up -d
#   open http://127.0.0.1:8787 and create the owner account
#
# Only the supervisor holds Docker access. Each guest sees only its own
# runtime socket directory; the control plane sees the runtime volume read-only.
name: agentcomputer

services:
  supervisor:
    build: { context: ., dockerfile: deploy/Dockerfile }
    image: agentcomputer/platform:0.1.0
    command: ["node", "supervisor/src/server.ts"]
    environment:
      ACP_SUPERVISOR_SOCK: /run/acp/supervisor.sock
      ACP_SUPERVISOR_SECRET: ${ACP_SUPERVISOR_SECRET:?set ACP_SUPERVISOR_SECRET in .env}
      ACP_GUEST_IMAGE: ${ACP_GUEST_IMAGE:-agentcomputer/guest:phase0}
      ACP_GUEST_NETWORK: agentcomputer_guests
      ACP_RUNTIME_VOLUME: agentcomputer_acp-run
      ACP_STORAGE_PROBE: /docker-storage
      ACP_HOST_RESERVE_MB: ${ACP_HOST_RESERVE_MB:-1024}
      ACP_MAX_RUNNING: ${ACP_MAX_RUNNING:-4}
      ACP_CPU_OVERCOMMIT: ${ACP_CPU_OVERCOMMIT:-1}
      ACP_MIN_FREE_DISK_GB: ${ACP_MIN_FREE_DISK_GB:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - acp-run:/run/acp
      - acp-supervisor-data:/data/supervisor
      # Exact Docker storage filesystem probe; no Docker volume tree access.
      - ${ACP_DOCKER_STORAGE_PROBE:?set a dedicated directory on the Docker data filesystem}:/docker-storage:ro
    network_mode: "none"
    depends_on: [egress]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  egress:
    build: { context: deploy/egress }
    image: agentcomputer/egress:0.1.0
    networks: [egress-public]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped

  control-plane:
    image: agentcomputer/platform:0.1.0
    command: ["node", "control-plane/src/server.ts"]
    environment:
      ACP_SUPERVISOR_SOCK: /run/acp/supervisor.sock
      ACP_SUPERVISOR_SECRET: ${ACP_SUPERVISOR_SECRET:?set ACP_SUPERVISOR_SECRET in .env}
      ACP_PORT: "8787"
      ACP_PUBLIC_ORIGIN: ${ACP_PUBLIC_ORIGIN:-}
      ACP_TRUST_PROXY: ${ACP_TRUST_PROXY:-false}
      ACP_DB: /data/control-plane.db
      ACP_IDLE_TIMEOUT_S: ${ACP_IDLE_TIMEOUT_S:-300}
    volumes:
      - acp-run:/run/acp:ro
      - acp-data:/data
    ports:
      # Localhost by default: put a TLS reverse proxy in front for
      # remote access (see DEPLOYMENT.md). Change to "8787:8787" only
      # on a trusted network.
      - "127.0.0.1:8787:8787"
    depends_on: [supervisor]
    restart: unless-stopped

  # Build-only helper: `docker compose --profile build build guest-image`
  # produces the guest image the supervisor instantiates per computer.
  guest-image:
    profiles: ["build"]
    build: { context: guest, dockerfile: Dockerfile }
    image: ${ACP_GUEST_IMAGE:-agentcomputer/guest:phase0}
    command: ["true"]

volumes:
  acp-run:
    name: agentcomputer_acp-run
  acp-supervisor-data:
  acp-data:

networks:
  egress-public:
    driver: bridge
